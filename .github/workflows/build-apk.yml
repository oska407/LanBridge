name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk，sdkmanager 在 PATH）。
      # 不使用 android-actions/setup-android@v3：其对预装 sdkmanager 的版本校验会误报
      # 「Wrong version in preinstalled sdkmanager」导致任务失败，直接用 sdkmanager 安装所需包即可。
      - name: Accept licenses & install SDK packages
        run: |
          SDKMANAGER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK (Gradle 8.5)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: wrapper :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanBridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
